{% if res.all_zero %}
<p class="scen-note note">No P&amp;L to map: every scenario prices this option the same as the base case, since it is too far out of the money for these shocks to give it value.</p>
<script>window.scenDraw = null;</script>
{% else %}
<div id="scen-chart" class="scen-chart"></div>
<p id="scen-empty" class="scen-note note" hidden>No P&amp;L to map at this rate shock: every scenario prices the option the same as the base case.</p>
<script>
  // Drawn after a zero timeout: htmx runs this script before it removes the old fragment.
  // The rate selector lives outside the fragment (index.html) and only picks which rate slice
  // of R.pnl is drawn, so changing it costs no request. R.pnl is [rate][vol][spot], with null
  // where the vol shock would take the vol below the app's minimum.
  setTimeout(function () {
    const R = {{ res|tojson }};
    const pick = document.getElementById("scen-rate");
    if (pick.options.length !== R.rate_shock_pts.length) {       // first fragment: fill the selector
      pick.innerHTML = "";
      R.rate_shock_pts.forEach(function (p, i) {
        pick.add(new Option(p === 0 ? "0 pts (base)" : (p > 0 ? "+" : "") + p + " pts", String(i)));
      });
      pick.value = String(R.rate_shock_pts.indexOf(0));
    }
    const css = getComputedStyle(document.documentElement);
    const color = (name) => css.getPropertyValue(name).trim();
    const rgb = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
    const mix = (a, b, t) => "rgb(" + rgb(a).map((x, i) => Math.round(x + (rgb(b)[i] - x) * t)).join(",") + ")";
    // Diverging about zero, accent to accent-2 (not red/green), through a neutral just off --panel
    // so a cell with no P&L still reads as a cell, and differently from a masked (blank) one.
    const colorscale = [[0, color("--accent")], [0.5, mix(color("--panel"), color("--line"), 0.35)],
                        [1, color("--accent-2")]];
    const signed = (n) => (n > 0 ? "+" : "") + n;
    // n significant digits and never an exponent, so a tiny underlying's P&L (1e-6) and a large
    // one's (1e4) both read as money. Fixed decimals would print the tiny one as +0.00.
    const sig = (v, n) => {
      if (v === 0) return "0";
      const d = Math.max(0, Math.min(20, n - 1 - Math.floor(Math.log10(Math.abs(v)))));
      const t = v.toFixed(d);
      return t.indexOf(".") < 0 ? t : t.replace(/\.?0+$/, "");
    };
    const signedSig = (v, n) => (v > 0 ? "+" : "") + sig(v, n);

    window.scenDraw = function () {
      const el = document.getElementById("scen-chart"), empty = document.getElementById("scen-empty");
      if (!el) return;                                           // an error or other fragment replaced this one
      const z = R.pnl[+pick.value];
      const flat = z.every((row) => row.every((v) => v === null || v === 0));
      el.hidden = flat;
      empty.hidden = !flat;
      if (flat) { Plotly.purge(el); return; }
      // With zmid 0 Plotly's color range is +/- the largest |P&L|, so five ticks there span it.
      const M = Math.max.apply(null, z.map((row) => Math.max.apply(null, row.map((v) => (v === null ? 0 : Math.abs(v))))));
      const ticks = [-M, -M / 2, 0, M / 2, M];
      const heat = {
        type: "heatmap", x: R.spot_shock_pct, y: R.vol_shock_pts, z: z,
        // The hover text is built here, in significant digits, rather than by a fixed-decimal d3 format.
        text: z.map((row, iy) => row.map((v, ix) => (v === null ? "" :
          "Spot " + sig(R.spot[ix], 4) + " (" + signed(R.spot_shock_pct[ix]) + "%)<br>Vol " +
          (R.vol[iy] * 100).toFixed(2) + "% (" + signed(R.vol_shock_pts[iy]) + " pts)<br>P&L " + signedSig(v, 4)))),
        zmid: 0, colorscale: colorscale, xgap: 1, ygap: 1, hoverongaps: false,
        colorbar: { thickness: 10, len: 0.95, tickvals: ticks, ticktext: ticks.map((t) => signedSig(t, 3)),
                    tickfont: { size: 10 } },
        hovertemplate: "%{text}<extra></extra>",
      };
      const base = {
        type: "scatter", mode: "markers", x: [0], y: [0], showlegend: false,
        marker: { symbol: "circle-open", size: 14, line: { width: 2, color: color("--ink") } },
        text: ["Base case<br>Spot " + sig(R.S0, 4) + ", vol " + (R.sigma * 100).toFixed(2) + "%<br>Price " +
               sig(R.base, 6)],
        hovertemplate: "%{text}<extra></extra>",
      };
      const layout = plotLayout({
        margin: { l: 46, r: 8, t: R.masked_vols ? 20 : 6, b: 38 }, showlegend: false,
        xaxis: { title: { text: "Spot shock (%)", standoff: 4 }, tickvals: R.spot_shock_pct,
                 ticktext: R.spot_shock_pct.map(signed), showgrid: false, zeroline: false },
        yaxis: { title: { text: "Vol shock (pts)", standoff: 4 }, tickvals: R.vol_shock_pts,
                 ticktext: R.vol_shock_pts.map(signed), showgrid: false, zeroline: false },
        annotations: R.masked_vols ? [{
          xref: "paper", yref: "paper", x: 0, y: 1.02, xanchor: "left", yanchor: "bottom", showarrow: false,
          text: "Blank rows: that vol shock would take the vol below 0.1%",
          font: { size: 11, color: color("--accent-2") } }] : [],
      });
      Plotly.react(el, [heat, base], layout, PLOT_CONFIG);
    };
    window.scenDraw();
  }, 0);
</script>
{% endif %}
